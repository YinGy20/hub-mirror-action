name: Sync to Gitee (Safe Mode)

on:
  schedule:
    - cron: '0 0 * * *' # 每天凌晨 0 点自动推送（可根据需要修改时间）
  workflow_dispatch:     # 允许你在网页上手动点击按钮触发

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check and Filter existing repos on Gitee
        id: filter-repos
        env:
          # ⚠️ 在这里填写你想同步的仓库名（多个用英文逗号隔开，不要有空格）
          ALL_REPOS: "awesome-math"
          GITEE_OWNER: "dddsm122"
        run: |
          IFS=',' read -ra REPOS <<< "$ALL_REPOS"
          TO_SYNC=""
          for REPO in "${REPOS[@]}"; do
            # 去除可能存在的空格
            REPO=$(echo "$REPO" | xargs)
            
            # 请求 Gitee API 检查仓库是否存在
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://gitee.com/api/v5/repos/$GITEE_OWNER/$REPO")
            
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "⚠️ 仓库 $REPO 在 Gitee 已存在，为了防止覆盖你的修改，自动跳过。"
            else
              echo "✅ 仓库 $REPO 不存在，准备同步。"
              TO_SYNC="${TO_SYNC:+$TO_SYNC,}$REPO"
            fi
          done
          
          if [ -z "$TO_SYNC" ]; then
            echo "sync_list=" >> $GITHUB_OUTPUT
            echo "⏭️ 所有仓库均已存在，本次无需执行同步。"
          else
            echo "sync_list=$TO_SYNC" >> $GITHUB_OUTPUT
            echo "🔄 本次准备同步的仓库：$TO_SYNC"
          fi
          exit 0

      - name: Mirror the Github repos to Gitee
        if: steps.filter-repos.outputs.sync_list != ''
        uses: Yikun/hub-mirror-action@master
        with:
          src: github/YinGy20
          dst: gitee/dddsm122
          dst_token: ${{ secrets.GITEE_TOKEN }}
          # 这里动态读取刚刚过滤好的安全列表
          static_list: ${{ steps.filter-repos.outputs.sync_list }} 
          force_update: true
