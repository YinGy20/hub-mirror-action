name: Sync to Gitee (Manual with SSH)

on:
  # 只保留手动触发，去掉了 schedule（凌晨定时）
  workflow_dispatch:     

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      # 1. 加载 SSH 私钥到 GitHub Actions 环境
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}

      # 2. 将 Gitee 加入已知主机（防止首次连接确认提示报错）
      - name: Add Gitee to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H gitee.com >> ~/.ssh/known_hosts

      

      - name: Mirror the Github repos to Gitee
        uses: Yikun/hub-mirror-action@master
        with:
          src: github/YinGy20
          dst: gitee/dddsm122
          dst_key: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          static_list: "KataGo,awesome-math"
          force_update: true
          timeout: 60m
